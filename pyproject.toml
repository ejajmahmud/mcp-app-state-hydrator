[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-app-state-hydrator"
version = "0.1.0"
description = "Hydrates and merges bidirectional state snapshots between headless MCP servers and client-side MCP App iframes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-app-state-hydrator = "mcp_app_state_hydrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_app_state_hydrator*"]
